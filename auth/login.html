<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masuk – Sakuin</title><link rel="icon" href="../assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css"></head>
<body data-auth>
<div id="content">
<h2>Masuk ke akun</h2>
<form id="f" autocomplete="off">
  <label>Username</label><input name="username" required placeholder="Masukkan username">
  <label>Password</label><input name="password" type="password" required placeholder="Masukkan password">
  <div class="err" id="err"></div>
  <button class="btn gold">Masuk</button>
</form>
<p class="sw">Belum punya akun? <a href="register.html">Daftar</a></p>
</div>
<script src="../assets/js/data.js"></script><script src="../assets/js/app.js"></script>
<script>$("#f").onsubmit=ev=>{ev.preventDefault();location.href="../pages/dashboard.html"}</script></body></html>
