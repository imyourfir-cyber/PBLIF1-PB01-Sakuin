<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password Baru – Sakuin</title><link rel="icon" href="../assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css"></head>
<body data-auth>
<div id="content">
<h2>Buat password baru</h2>
<p style="color:var(--mut);margin-top:6px">Passwordmu sudah direset admin. Buat password baru untuk melanjutkan.</p>
<form id="f">
  <label>Password baru</label><input name="baru" type="password" required placeholder="Minimal 6 karakter">
  <label>Konfirmasi password baru</label><input name="konfirmasi" type="password" required placeholder="Ulangi password baru">
  <div class="err" id="err"></div>
  <button class="btn gold">Simpan Password</button>
</form>
<p class="sw"><a href="login.html?logout=1">Batal dan keluar</a></p>
</div>
<script src="../assets/js/data.js"></script><script src="../assets/js/app.js"></script>

</body></html>
