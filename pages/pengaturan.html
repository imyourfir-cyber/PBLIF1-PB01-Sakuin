<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pengaturan – Sakuin</title>
  <link rel="icon" href="../assets/img/logo.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Gaya aplikasi -->
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body data-page="pengaturan" data-title="Pengaturan">
  <div id="content">

    <div class="glass pad prof">
      <h3>Pengaturan</h3>
      <hr>

      <!-- Notifikasi -->
      <div class="row">
        <span>Notifikasi</span>
        <span style="display: flex; align-items: center; gap: 10px">
          <b id="nt">ON</b>
          <button class="tg" id="tg" onclick="tglNotif()" aria-label="Notifikasi"><i></i></button>
        </span>
      </div>

      <!-- Tampilan -->
      <div class="row">
        <span>Tampilan</span>
        <div class="seg">
          <a id="t-dark" href="#" onclick="return setTema('dark')">Dark</a>
          <a id="t-light" href="#" onclick="return setTema('light')">Light</a>
        </div>
      </div>

      <!-- Keamanan -->
      <div class="row">
        <span>Keamanan</span>
        <button class="btn sm" onclick="openM('m-pass')">Ubah Password</button>
      </div>

      <!-- Bahasa -->
      <div class="row">
        <span>Bahasa</span>
        <select>
          <option>Indonesia</option>
        </select>
      </div>

      <!-- Logout -->
      <a class="btn dng" style="display: block; margin-top: 18px" href="../auth/login.html?logout=1">Logout</a>
    </div>

  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
